name: Apply Clippah v0.3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-v03.yml"
      - ".clippah-v03/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: clippah-v03-bootstrap
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify v0.3 patch
        shell: bash
        run: |
          cat .clippah-v03/part1.b64 .clippah-v03/part2.b64 .clippah-v03/part3.b64 .clippah-v03/part4.b64 .clippah-v03/part5.b64             | tr -d '\n\r ' | base64 -d > /tmp/clippah-v03.tar.gz
          echo "510682cd7bc976c8f3ce4dd34e6e9ee3455e56028c68722e5e73c9940ea0e1fd  /tmp/clippah-v03.tar.gz" | sha256sum -c -
          tar -xzf /tmp/clippah-v03.tar.gz -C .
          rm -rf .clippah-v03
          rm -f .github/workflows/apply-v03.yml

      - name: Commit v0.3
        shell: bash
        run: |
          git config user.name "Clippah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build Clippah v0.3 creator workflow and agent controls"
          git push
