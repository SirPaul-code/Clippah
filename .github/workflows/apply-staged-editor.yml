name: Apply staged editor build

on:
  push:
    branches: ["main"]
    paths:
      - ".staging/v04/**"
      - ".github/workflows/apply-staged-editor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct staged editor
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .staging/v04 ]; then
            echo "No v0.4 staging payload; nothing to apply."
            exit 0
          fi

          cat .staging/v04/editor.js.b64.* | tr -d '\n\r' | base64 -d | gzip -d > editor.js
          cat .staging/v04/editor.css.b64.* | tr -d '\n\r' | base64 -d | gzip -d > editor.css
          cat .staging/v04/editor.html.b64.* | tr -d '\n\r' | base64 -d | gzip -d > editor.html

          node --check editor.js
          node -e "const fs=require('fs'); const p='manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); m.version='0.4.0'; fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"

          rm -rf .staging/v04

      - name: Commit generated editor
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor.js editor.css editor.html manifest.json .staging
          git commit -m "Build Clippah v0.4 NLE editor"
          git push
