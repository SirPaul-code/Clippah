name: Validate and package extension

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest and JavaScript
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));if(m.manifest_version!==3)throw new Error('Expected MV3');console.log('Clippah',m.version)"
          node --check background.js
          node --check content.js
          node --check offscreen.js
          node --check editor.js
          node --check options.js
          node --check updater.js
          node --test tests/updater.test.cjs
          node -e "const fs=require('fs');const r=require('./runtime-files.json');if(r.schema!==1)throw Error('Invalid runtime schema');for(const p of r.files){if(!fs.existsSync(p))throw Error('Missing runtime file: '+p)}if(!r.files.includes('updater.js'))throw Error('Updater missing from install bundle')"
          node --check mcp/server.js

      - name: Validate MCP server dependencies
        working-directory: mcp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node -e "Promise.all([import('@modelcontextprotocol/server'),import('@modelcontextprotocol/server/stdio')]).then(()=>console.log('MCP SDK imports OK'))"
          set +e
          timeout 2s node server.js </dev/null >/tmp/clippah-mcp.out 2>/tmp/clippah-mcp.err
          code=$?
          set -e
          cat /tmp/clippah-mcp.err
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Read version
        id: meta
        run: echo "version=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('manifest.json','utf8')).version)")" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Package full downloadable bundle
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          zip -qr "dist/Clippah-v${version}-full.zip" . -x '.git/*' 'dist/*' 'mcp/node_modules/*' '.staging/*'

      - name: Prepare unpacked extension for one-step installation
        run: |
          node -e "const fs=require('fs'),path=require('path');for(const f of require('./runtime-files.json').files){const dest=path.join('dist','install',f);fs.mkdirSync(path.dirname(dest),{recursive:true});fs.copyFileSync(f,dest)}"

      - uses: actions/upload-artifact@v4
        with:
          name: Clippah-v${{ steps.meta.outputs.version }}
          path: dist/install/
          if-no-files-found: error

      - name: Upload full bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clippah-v${{ steps.meta.outputs.version }}-full
          path: dist/Clippah-v${{ steps.meta.outputs.version }}-full.zip
          if-no-files-found: error
