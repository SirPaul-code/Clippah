name: Validate and package extension

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest and JavaScript
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));if(m.manifest_version!==3)throw new Error('Expected MV3');console.log('Clippah',m.version)"
          node --check background.js
          node --check content.js
          node --check offscreen.js
          node --check editor.js
          node --check options.js
          node --check mcp/server.js

      - name: Read version
        id: meta
        run: echo "version=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('manifest.json','utf8')).version)")" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Clippah-v${{ steps.meta.outputs.version }}
          path: dist/Clippah-v${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error
